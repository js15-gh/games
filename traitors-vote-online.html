<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Round Table — Traitors Vote</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0C0F0E; --panel:#131816; --line:rgba(201,164,76,.28);
    --gold:#C9A44C; --goldDim:#8a7340; --crimson:#A32633;
    --ink:#E8E0CE; --faint:#8B9089;
  }
  * { box-sizing:border-box; font-family:'EB Garamond',Georgia,serif; }
  body { margin:0; background:var(--bg); color:var(--ink); min-height:100vh; }
  .wrap { max-width:560px; margin:0 auto; padding:0 16px 40px; }
  header { text-align:center; padding:40px 8px 8px; }
  h1 { font-family:'Cinzel',serif; font-weight:700; letter-spacing:.06em;
       font-size:clamp(30px,7vw,52px); margin:6px 0 0; }
  .eyebrow { color:var(--gold); letter-spacing:.28em; font-size:12px;
             text-transform:uppercase; font-family:'Cinzel',serif; }
  .rule { height:1px; margin:20px 0; opacity:.5;
          background:linear-gradient(90deg,transparent,var(--gold),transparent); }
  .panel { background:var(--panel); border:1px solid var(--line);
           border-radius:4px; padding:24px 20px; margin-top:20px; }
  .row { display:flex; justify-content:space-between; align-items:center;
         padding:10px 0; border-bottom:1px solid rgba(201,164,76,.14); font-size:17px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
          gap:10px; margin-top:16px; }
  input { flex:1; background:var(--bg); border:1px solid var(--line); border-radius:4px;
          color:var(--ink); padding:12px 14px; font-size:17px; width:100%; }
  button { cursor:pointer; border-radius:4px; }
  button:focus-visible, input:focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
  .btn-gold { background:var(--gold); color:var(--bg); border:none; padding:13px 20px;
              font-size:15px; font-family:'Cinzel',serif; font-weight:600;
              letter-spacing:.12em; text-transform:uppercase; }
  .btn-crimson { background:var(--crimson); color:#fff; border:none; padding:13px 20px;
                 font-size:15px; font-family:'Cinzel',serif; font-weight:600;
                 letter-spacing:.12em; text-transform:uppercase; }
  .btn-ghost { background:transparent; border:1px solid rgba(139,144,137,.4);
               color:var(--faint); padding:9px 14px; font-size:13px; }
  .seat { background:transparent; border:1px solid var(--line); color:var(--ink);
          padding:14px 10px; font-size:17px; }
  .seat.chosen { background:var(--crimson); border-color:var(--crimson); color:#fff; }
  .full { width:100%; margin-top:14px; }
  .faint { color:var(--faint); }
  .err { color:var(--crimson); text-align:center; font-size:14px; min-height:18px; }
  .center { text-align:center; }
  .banished-name { font-family:'Cinzel',serif; font-weight:700; letter-spacing:.08em;
                   font-size:clamp(34px,9vw,56px); margin:16px 0 4px; }
  .stack { display:grid; gap:10px; margin-top:24px; }
  details summary { color:var(--faint); cursor:pointer; font-size:14px; }
  footer { text-align:center; padding-top:28px; color:var(--goldDim);
           font-size:12px; letter-spacing:.2em; }
  .roombar { background:var(--panel); border:1px solid var(--line); border-radius:4px;
             padding:14px 16px; margin-top:18px; }
  .rb-top { display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  .roomcode { font-family:'Cinzel',serif; font-weight:700; letter-spacing:.28em;
              font-size:26px; color:var(--gold); }
  .linkfield { font-size:13px; margin-top:10px; padding:9px 10px; color:var(--faint); }
  .rb-actions { display:flex; gap:8px; margin-top:10px; }
  .rb-actions button { flex:1; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow" id="crumb"></div>
    <h1>THE ROUND TABLE</h1>
    <div class="rule"></div>
  </header>
  <p class="err" id="err"></p>
  <div id="roombar"></div>
  <div id="app"><p class="faint center" style="margin-top:60px">Lighting the candles…</p></div>
  <footer id="foot">LIVE TABLE — EVERYONE ON THIS LINK PLAYS TOGETHER</footer>
</div>

<script>
// ════════════════════════════════════════════════════════════
//  SETUP — paste your two Supabase values between the quotes.
//  Settings → API: "Project URL" and the "anon / publishable" key.
//  (These are designed to be public — NOT your database password.)
// ════════════════════════════════════════════════════════════
const SUPABASE_URL = "https://wwfoeclbsizxqfasvgsf.supabase.co";      // e.g. https://abcd1234.supabase.co
const SUPABASE_KEY = "sb_publishable_cFOQk3yLvX_OuB5baJA8Sg_ZqiY0sSl";
const GAME_ID = "traitors";   // namespaces this game's rows; the table code is appended per game
// ════════════════════════════════════════════════════════════

const FRESH = { phase:'setup', roster:[], players:[], votes:{}, round:1, gameNo:1,
                banishedLog:[], gamesLog:[] };
let G = null;
let me = null;          // this device's identity (local only)
let stamp = 0;          // monotonic counter for last-write-wins

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setErr(m){ $('err').textContent = m || ''; }

const configured = () => SUPABASE_URL.startsWith('https://') && !SUPABASE_KEY.includes('PASTE');
const HDRS = () => ({
  'apikey': SUPABASE_KEY,
  'Authorization': 'Bearer ' + SUPABASE_KEY,
  'Content-Type': 'application/json'
});

async function loadState(){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/games?id=eq.${rowId()}&select=state`, { headers: HDRS() });
  if (!r.ok) throw new Error('load '+r.status);
  const rows = await r.json();
  return rows.length ? rows[0].state : null;
}
async function saveState(next){
  if (!ROOM) throw new Error('no room');   // never write to a malformed row id
  next._stamp = ++stamp;
  const r = await fetch(`${SUPABASE_URL}/rest/v1/games`, {
    method:'POST',
    headers:{ ...HDRS(), 'Prefer':'resolution=merge-duplicates' },
    body: JSON.stringify([{ id: GAME_ID + '-' + ROOM, state: next, updated_at: new Date().toISOString() }])
  });
  if (!r.ok) throw new Error('save '+r.status);
}

async function mutate(fn){
  const next = fn(structuredClone(G));
  G = next; render();
  try { await saveState(next); setErr(''); }
  catch { setErr("Couldn't sync — your move may not be visible to others yet. It will retry."); pending = next; }
}
let pending = null;

async function poll(){
  if (!joined) return;
  try {
    if (pending){ await saveState(pending); pending = null; setErr(''); }
    const s = await loadState();
    if (s && (!G || (s._stamp||0) >= (G._stamp||0))){
      const changed = JSON.stringify(s) !== JSON.stringify(G);
      G = s; stamp = Math.max(stamp, s._stamp||0);
      if (changed) render();
    } else if (!G){ G = structuredClone(FRESH); render(); }
  } catch {
    if (!G){ G = structuredClone(FRESH); render(); }
  }
}

function tally(){
  const t = {};
  Object.values(G.votes).forEach(v => t[v]=(t[v]||0)+1);
  return Object.entries(t).sort((a,b)=>b[1]-a[1]);
}
function banished(){
  const t = tally();
  if (!t.length) return {name:null,tie:false};
  if (t.length>1 && t[0][1]===t[1][1]) return {name:null,tie:true};
  return {name:t[0][0],tie:false};
}

// ── actions ──
function addPlayer(){
  const el = $('nameInput'); const n = el.value.trim();
  if (!n) return;
  if (G.roster.some(p=>p.toLowerCase()===n.toLowerCase())){ setErr('That name is already at the table.'); return; }
  setErr(''); el.value='';
  mutate(g=>{ g.roster.push(n); return g; });
}
function removePlayer(n){ mutate(g=>{ g.roster=g.roster.filter(p=>p!==n); return g; }); }
function startVoting(){
  if (G.roster.length<3){ setErr('You need at least 3 players.'); return; }
  setErr('');
  mutate(g=>{ g.phase='voting'; g.players=[...g.roster]; g.votes={}; g.round=1; g.banishedLog=[]; return g; });
}
function pickMe(n){ me=n; render(); }
function castVote(t){ if(!me||t===me) return; mutate(g=>{ g.votes[me]=t; return g; }); }
function reveal(){ mutate(g=>{ g.phase='reveal'; return g; }); }
function nextRound(rm){
  mutate(g=>{
    const b = banished();
    if (rm && b.name){
      g.players = g.players.filter(p=>p!==b.name);
      g.banishedLog.push({round:g.round,name:b.name});
      if (b.name===me) me=null;
    }
    g.phase='voting'; g.votes={}; g.round++;
    return g;
  });
}
function endGame(){
  mutate(g=>{ g.gamesLog.push({game:g.gameNo,banished:g.banishedLog.map(b=>b.name)}); g.phase='gameover'; return g; });
}
function startNextGame(){
  me=null;
  mutate(g=>{ g.gameNo++; g.phase='voting'; g.players=[...g.roster]; g.votes={}; g.round=1; g.banishedLog=[]; return g; });
}
function editPlayers(){ me=null; mutate(g=>{ g.phase='setup'; return g; }); }
function resetAll(){ me=null; mutate(()=>structuredClone(FRESH)); }

// ── render ──
function render(){
  if (!configured()){
    $('app').innerHTML = `<div class="panel">
      <div class="eyebrow">One-time setup needed</div>
      <p class="faint" style="line-height:1.6;margin-top:12px">Open this file in a text editor and paste your Supabase <b style="color:var(--ink)">Project URL</b> and <b style="color:var(--ink)">anon key</b> into the two marked lines near the top of the &lt;script&gt; section. Then re-upload/host the file.</p>
    </div>`;
    return;
  }
  $('crumb').textContent = 'Game '+G.gameNo + (G.phase==='voting'||G.phase==='reveal' ? ' · Round '+G.round : '');
  const app = $('app');
  const votedCount = Object.keys(G.votes).filter(v=>G.players.includes(v)).length;

  if (G.phase==='setup'){
    const hadInput = $('nameInput'); const keep = hadInput ? hadInput.value : '';
    app.innerHTML = `
      <div class="panel">
        <div class="eyebrow">Seat the players</div>
        <div style="display:flex;gap:8px;margin:14px 0">
          <input id="nameInput" placeholder="Player name" value="${esc(keep)}">
          <button class="btn-gold" onclick="addPlayer()">Add</button>
        </div>
        ${G.roster.length===0
          ? '<p class="faint" style="font-style:italic">The table is empty. Add each player\'s name to begin.</p>'
          : G.roster.map(p=>`<div class="row"><span>${esc(p)}</span>
              <button class="btn-ghost" onclick="removePlayer('${esc(p)}')">Remove</button></div>`).join('')}
        <button class="btn-crimson full" ${G.roster.length<3?'disabled style="opacity:.4"':''}
          onclick="startVoting()">Begin game ${G.gameNo}</button>
      </div>` + historyHTML();
    $('nameInput').addEventListener('keydown',e=>{ if(e.key==='Enter') addPlayer(); });
    return;
  }

  if (G.phase==='voting'){
    let inner;
    if (!me){
      inner = `<div class="eyebrow">Who are you?</div>
        <p class="faint" style="font-size:14px;margin-top:6px">Choose your own name. Your vote stays hidden until the reveal.</p>
        <div class="grid">${G.players.map(p=>
          `<button class="seat" onclick="pickMe('${esc(p)}')">${esc(p)}${G.votes[p]?' ✦':''}</button>`).join('')}</div>`;
    } else {
      inner = `<div class="eyebrow">${G.votes[me]?'Your vote is cast':esc(me)+', cast your vote'}</div>
        <p class="faint" style="font-size:14px;margin-top:6px">${G.votes[me]?'You may change it until the reveal.':'Choose who you suspect.'}</p>
        <div class="grid">${G.players.filter(p=>p!==me).map(p=>
          `<button class="seat ${G.votes[me]===p?'chosen':''}" onclick="castVote('${esc(p)}')">${esc(p)}${G.votes[p]&&G.votes[me]!==p?' ✦':''}</button>`).join('')}</div>
        <button class="btn-ghost" style="margin-top:14px" onclick="me=null;render()">Not ${esc(me)}? Switch player</button>`;
    }
    app.innerHTML = `<div class="panel">${inner}
        <div class="rule"></div>
        <p class="faint center" style="font-size:14px">${votedCount} of ${G.players.length} votes cast</p>
        <button class="btn-gold full" onclick="reveal()">Reveal the votes</button>
        <button class="btn-ghost full" onclick="endGame()">End this game early</button>
      </div>` + banishedLineHTML() + historyHTML();
    return;
  }

  if (G.phase==='reveal'){
    const b = banished(); const t = tally();
    app.innerHTML = `
      <div class="panel center">
        <div class="eyebrow">The table has spoken</div>
        ${b.tie ? '<h2 class="banished-name">A TIE</h2>'
          : b.name ? `<h2 class="banished-name">${esc(b.name.toUpperCase())}</h2>
                      <p style="color:var(--crimson);letter-spacing:.3em;font-size:14px">BANISHED</p>`
          : '<p class="faint">No votes were cast.</p>'}
        <div class="rule"></div>
        <div style="text-align:left;max-width:360px;margin:0 auto">
          ${t.map(([n,c])=>`<div class="row"><span>${esc(n)}</span>
            <span style="color:var(--gold);font-family:'Cinzel',serif">${c} ${c===1?'vote':'votes'}</span></div>`).join('')}
          <details style="margin-top:14px"><summary>Who voted for whom</summary>
            ${Object.entries(G.votes).map(([v,tg])=>
              `<p class="faint" style="font-size:14px;margin:6px 0">${esc(v)} → <span style="color:var(--ink)">${esc(tg)}</span></p>`).join('')}
          </details>
        </div>
        <div class="stack">
          ${b.name?`<button class="btn-crimson" onclick="nextRound(true)">Banish ${esc(b.name)} · next round</button>`:''}
          <button class="btn-gold" onclick="nextRound(false)">${b.tie?'Revote':'Keep everyone · next round'}</button>
          <button class="btn-ghost" onclick="endGame()">End game ${G.gameNo}</button>
        </div>
      </div>` + historyHTML();
    return;
  }

  if (G.phase==='gameover'){
    app.innerHTML = `
      <div class="panel center">
        <div class="eyebrow">Game ${G.gameNo} complete</div>
        ${G.banishedLog.length>0
          ? '<p class="faint" style="margin-top:14px">Banished this game:</p><div style="max-width:360px;margin:0 auto">' +
            G.banishedLog.map(b=>`<div class="row"><span>${esc(b.name)}</span>
              <span style="color:var(--goldDim);font-size:14px">Round ${b.round}</span></div>`).join('') + '</div>'
          : '<p class="faint" style="margin-top:14px">No one was banished this game.</p>'}
        <div class="stack">
          <button class="btn-crimson" onclick="startNextGame()">Start game ${G.gameNo+1} · same players</button>
          <button class="btn-gold" onclick="editPlayers()">Change players, then play again</button>
          <button class="btn-ghost" onclick="resetAll()">Wipe everything and start fresh</button>
        </div>
      </div>` + historyHTML();
  }
}

function banishedLineHTML(){
  if (!G.banishedLog.length) return '';
  return `<p class="faint center" style="font-size:13px;margin-top:18px">Banished this game: ${
    G.banishedLog.map(b=>esc(b.name)+' (R'+b.round+')').join(' · ')}</p>`;
}
function historyHTML(){
  if (!G.gamesLog.length) return '';
  const counts = {};
  G.gamesLog.forEach(g=>g.banished.forEach(n=>counts[n]=(counts[n]||0)+1));
  const ranked = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,3);
  return `<div style="margin-top:20px"><details>
    <summary style="color:var(--gold);font-family:'Cinzel',serif;letter-spacing:.2em;
      text-transform:uppercase;font-size:13px;text-align:center;list-style-position:inside">
      Past games (${G.gamesLog.length})</summary>
    <div style="max-width:360px;margin:12px auto 0">
      ${G.gamesLog.map(g=>`<p class="faint" style="font-size:14px;margin:6px 0">
        <span style="color:var(--ink)">Game ${g.game}:</span> ${
        g.banished.length?g.banished.map(esc).join(' → '):'no banishments'}</p>`).join('')}
      ${ranked.length?`<div class="rule"></div><p class="faint center" style="font-size:13px">
        Most banished: ${ranked.map(([n,c])=>esc(n)+' ('+c+'×)').join(' · ')}</p>`:''}
    </div></details></div>`;
}

// ════════════════════════════════════════════════════════════
//  ROOM CODES — each table gets its own short code, so many
//  groups can play at the same time without colliding.
// ════════════════════════════════════════════════════════════
const CODE_ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; // no I/O/0/1 — easy to read aloud
const cleanCode = (s) => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);

function newCode(){
  const r = new Uint32Array(4);
  crypto.getRandomValues(r);
  let c = '';
  for (let i = 0; i < 4; i++) c += CODE_ALPHABET[r[i] % CODE_ALPHABET.length];
  return c;
}

let ROOM = cleanCode(new URLSearchParams(location.search).get('room'));
let joined = false;
let pollTimer = null;

const rowId     = () => encodeURIComponent(GAME_ID + '-' + ROOM);
const inviteURL = () => location.origin + location.pathname + '?room=' + ROOM;

function enterRoom(){
  joined = true;
  history.replaceState(null, '', inviteURL());
  renderRoomBar();
  render();
  if (!pollTimer) pollTimer = setInterval(poll, 2500);
}

function leaveRoom(){
  if (pollTimer){ clearInterval(pollTimer); pollTimer = null; }
  joined = false; ROOM = ''; G = null; me = null; pending = null; 
  history.replaceState(null, '', location.pathname);
  $('roombar').innerHTML = '';
  $('crumb').textContent = '';
  setErr('');
  renderLobby();
}

async function createRoom(){
  setErr('');
  const btn = $('createBtn'); if (btn){ btn.disabled = true; btn.textContent = 'Creating…'; }
  try {
    for (let i = 0; i < 5; i++){
      ROOM = newCode();
      if (await loadState()) continue;   // code already in use — draw another
      G = structuredClone(FRESH);
      await saveState(G);
      enterRoom();
      return;
    }
    ROOM = '';
    setErr('Could not find a free code. Please try again.');
  } catch {
    ROOM = '';
    setErr("Couldn't reach the game service. Check your connection and try again.");
  }
  if ($('createBtn')){ $('createBtn').disabled = false; $('createBtn').textContent = 'Create a table'; }
}

async function joinRoom(raw){
  setErr('');
  const c = cleanCode(raw);
  if (c.length < 4){ setErr('Enter the 4-character code.'); return; }
  ROOM = c;
  let s;
  try { s = await loadState(); }
  catch { ROOM = ''; setErr("Couldn't reach the game service. Check your connection and try again."); return; }
  if (!s){ ROOM = ''; renderLobby('No game found with code ' + c + '. Check the code, or start a new one.'); return; }
  G = s; stamp = Math.max(stamp, s._stamp || 0);
  enterRoom();
}

function copyInvite(){
  const url = inviteURL();
  const done = () => {
    const b = $('copyBtn');
    if (!b) return;
    b.textContent = 'Link copied';
    setTimeout(() => { if ($('copyBtn')) $('copyBtn').textContent = 'Copy invite link'; }, 1600);
  };
  const fallback = () => { const f = $('inviteField'); if (f){ f.focus(); f.select(); } };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(done, fallback);
  } else fallback();
}

function renderRoomBar(){
  $('roombar').innerHTML = `
    <div class="roombar">
      <div class="rb-top">
        <span class="eyebrow">Table code</span>
        <span class="roomcode">${esc(ROOM)}</span>
      </div>
      <input id="inviteField" class="linkfield" readonly value="${esc(inviteURL())}"
             onclick="this.select()" aria-label="Invite link">
      <div class="rb-actions">
        <button class="btn-ghost" id="copyBtn" onclick="copyInvite()">Copy invite link</button>
        <button class="btn-ghost" onclick="leaveRoom()">Leave</button>
      </div>
    </div>`;
}

function renderLobby(msg){
  if (msg) setErr(msg);
  $('app').innerHTML = `
    <div class="panel">
      <div class="eyebrow">Start a new table</div>
      <p class="faint" style="line-height:1.6;margin-top:10px">Create a table, then send the link to
        everyone playing. You all share one live game — each player votes from their own phone.</p>
      <button class="btn-crimson full" id="createBtn" onclick="createRoom()">Create a table</button>
    </div>
    <div class="panel">
      <div class="eyebrow">Join a table</div>
      <p class="faint" style="line-height:1.6;margin-top:10px">Someone already made one? Enter their code.</p>
      <div style="display:flex;gap:8px;margin-top:14px">
        <input id="codeInput" placeholder="Code" maxlength="6" autocapitalize="characters"
               autocomplete="off" spellcheck="false"
               style="text-transform:uppercase;letter-spacing:.24em;font-family:'Cinzel',serif">
        <button class="btn-gold" onclick="joinRoom($('codeInput').value)">Join</button>
      </div>
    </div>`;
  $('codeInput').addEventListener('keydown', e => { if (e.key === 'Enter') joinRoom(e.target.value); });
}

(async function boot(){
  if (!configured()){ render(); return; }
  if (ROOM) await joinRoom(ROOM);
  else renderLobby();
})();
</script>
</body>
</html>
